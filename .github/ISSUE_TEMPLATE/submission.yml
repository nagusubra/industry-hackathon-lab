name: Hackathon Submission
description: Submit your team project (open Fri Oct 2 5:00 PM – Sun Oct 4 12:10 PM MDT grace cutoff).
title: "[Submission] <Team Name> - <Project Title>"
labels: ["submission"]

body:
  - type: markdown
    attributes:
      value: |
        ## IEEE YP Industry Hackathon — Project Submission
        **Window:** Fri Oct 2, 5:00 PM MDT → Sun Oct 4, 12:00 PM MDT (10-min grace to 12:10 PM MDT).
        **One issue per team.** Only the author can edit this body; teammates post updates as comments. All issues lock at close.
        Repo will be public at 5 PM Oct 2; submissions before that are not accepted.

  - type: input
    id: team-name
    attributes:
      label: 1. Team Name
      description: Your official team name (must provide).
      placeholder: e.g. Circuit Breakers
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: 2. Team Member Names and GitHub Handles
      description: |
        List 2–5 members, one per line: Full Name (@github-handle).
        Example:
        Ada Lovelace (@ada-l)
        Alan Turing (@alan-t)
      placeholder: |
        Full Name (@github-handle)
        Full Name (@github-handle)
    validations:
      required: true

  - type: input
    id: project-stream
    attributes:
      label: 3. Project Stream
      description: Your industrial stream (must provide).
      placeholder: e.g. Energy and Infrastructure Systems
    validations:
      required: true

  - type: input
    id: project-title
    attributes:
      label: 4. Project Title
      description: Title of your project (must provide).
      placeholder: e.g. Autonomous 311 Dispatch Agent
    validations:
      required: true

  - type: textarea
    id: tagline
    attributes:
      label: 5. Project Short Description (3 lines max)
      description: Short tagline for showcase. Keep to 3 lines max / ~280 chars. A validator will warn if longer.
      placeholder: One-to-three-line tagline for your project.
    validations:
      required: true

  - type: input
    id: repo-link
    attributes:
      label: 6. GitHub Repository Link
      description: Public repo URL, e.g. https://github.com/<owner>/<repo> (must provide, must be public).
      placeholder: https://github.com/<owner>/<repo>
    validations:
      required: true

  - type: textarea
    id: about
    attributes:
      label: 7. About the Project
      description: |
        What inspired you, what you learned, how you built it, challenges faced.
        Markdown supported; LaTeX math supported via $...$ (inline) and $$...$$ (block).
      placeholder: |
        ## Inspiration
        ...
        ## What we learned
        ...
        ## How we built it
        ...
        ## Challenges
        ...
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: 8. Project Pictures / Screenshots
      description: |
        REQUIRED: minimum 2, maximum 5 images (PNG/JPG/GIF, 10 MB each on GitHub Free).
        Drag and drop files here. Show proof your app works (UI, terminal output, plots).
        Longer videos must go in field 9 as a link (Free plan caps direct video upload at 10 MB).
    validations:
      required: true

  - type: input
    id: demo-link
    attributes:
      label: 9. Link to Demo Video or Live Site
      description: REQUIRED — YouTube (unlisted OK), Loom, or live-site URL.
      placeholder: https://youtube.com/... or https://your-demo-site/...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 10. Any Additional Info
      description: Optional — Option A/B, dataset citations, passwords/test accounts for judges, sponsor tech used (e.g. ElevenLabs).
      placeholder: "e.g. Option B Case 3; dataset citation; test login"
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: Eligibility Confirmation
      description: Confirm to submit.
      options:
        - label: Our team has 2–5 registered members and this is our single team submission. Our repo is public and our work is original.
          required: true
        - label: We agree to the hackathon RULES.md and Code of Conduct and understand submissions lock at the deadline.
          required: true
