name: Archive traffic data

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-traffic
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive traffic
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/archive_traffic.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .metrics doc/metric
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): archive traffic data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No changes to commit"
          fi
