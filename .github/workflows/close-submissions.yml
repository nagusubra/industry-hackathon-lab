# Closes submissions: removes the issue form + locks all open submission issues.
# Primary trigger is MANUAL (organizer clicks Run workflow at 12:00 PM MDT Oct 4).
# Cron is a safety net: 0 18 4 10 * = 12:00 PM MDT Oct 4 = 18:00 UTC (exact minute; may lag 5–30 min under load).
# Sharp deadline (from organizer): 12:00 PM MDT sharp — no exceptions. Issues created after 12:00 PM MDT get `late`.
# Free-plan safe: ubuntu-latest standard runner, ~1–2 min/run.
name: Close Submissions

on:
  schedule:
    - cron: "0 18 4 10 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (no commits, locks, or closes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: submissions-gate
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove submission template (freeze new submissions)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/ISSUE_TEMPLATE/submission.yml
          git add .github/ISSUE_TEMPLATE/submission.yml
          git diff --cached --quiet || git commit -m "chore: close hackathon submissions (Oct 4 12PM MDT)"
          git push || echo "nothing to push"

      - name: Comment, label, and lock open submissions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dryRun = "${{ inputs.dry_run }}" === "true";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "submission", per_page: 100
            });
            core.info(`Found ${issues.length} open submission issues`);
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const msg = [
                "Submissions are now **CLOSED** (Sun Oct 4, 12:00 PM MDT sharp — no exceptions).",
                "This thread is locked — no further edits or comments. Judging: 1–4 PM MDT. Good luck!"
              ].join("\n");
              if (dryRun) { core.info(`[dry-run] would lock #${issue.number}`); continue; }
              try {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: msg });
                await github.rest.issues.lock({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, lock_reason: "resolved" });
              } catch (e) { core.warning(`lock failed #${issue.number}: ${e.message}`); }
            }

      - name: Announce submissions closed
        if: ${{ inputs.dry_run != true }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "Submissions CLOSED — judging 1–4 PM MDT";
            const body = "Submission window ended Sun Oct 4, 12:00 PM MDT sharp (no exceptions). All submission threads are locked. Judges: export via `python scripts/export_submissions.py`. Winners announced 4 PM MDT.";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            if (!issues.some(i => i.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["submission"] });
            }
